name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        env:
          REVENIUM_METERING_API_KEY: "hak_test_dummy_key_for_ci_testing_only"
          REVENIUM_METERING_BASE_URL: "https://api.test.revenium.ai"
        run: |
          pytest tests/ -v --tb=short -m "not e2e"

      - name: Run linting
        if: matrix.python-version == '3.12'
        run: |
          flake8 revenium_middleware/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 revenium_middleware/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        env:
          REVENIUM_METERING_API_KEY: "hak_test_dummy_key_for_ci_testing_only"
          REVENIUM_METERING_BASE_URL: "https://api.test.revenium.ai"
        run: |
          pytest tests/ -v --tb=short -m "not e2e" --cov=revenium_middleware --cov-report=term-missing --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

