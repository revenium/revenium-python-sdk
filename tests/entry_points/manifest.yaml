# Supported-modes manifest for the metering entry-point matrix (BACK-3593).
#
# One row per entry point x sync/async x streamed/not. The matrix in
# test_entry_point_matrix.py executes every row whose status is `metered` or
# `gap` against a stubbed provider transport and requires exactly one metering
# payload that satisfies the row's oracle. A `gap` row is a known missing wrap:
# it runs as xfail(strict=True) keyed by its ticket, so the fix turns it into an
# unexpected pass and forces the row to move to `metered`. `not_executed` rows
# are recorded here so the scope is deliberate, with the reason they cannot run
# in this environment. `unsupported` = "deliberately not metered; the reason says why".
#
# `ticket_row` is the row number in the BACK-3593 sweep table; null marks a
# positive control or a cell the table does not list.
#
# `env` names the test environment a row runs in (`default` when absent). The
# runner skips rows of other environments; REVENIUM_MATRIX_ENV selects one (see
# instrumented.py). `vertex` has its own venv and CI job (vertex-matrix)
# because vertexai does not co-install with the other provider extras.
#
# `since` is the first SDK release that meters the row; a row fixed on main but
# not yet released carries the next patch version, the lowest release the fix can
# ship in. The release-verify workflow tests a published release with
# REVENIUM_VERIFY_VERSION set, and a row whose `since` is later than that
# release runs as a strict xfail: it must still miss its oracle there. A pass
# means either the matrix stopped detecting the gap or `since` is wrong, and a
# crash raised only with our middleware stays red. Without the variable (the
# source-tree CI) every row is required.

version: 1
sdk_version: 0.9.1

# Token counts must equal the provider's `usage` stub values (input, output, and
# cache_read / reasoning where the stub sets them). A row marked
# `usage: approximate` gets its counts from the provider library rather than the
# stub, so only "> 0" is asserted, and it must say why in `usage_reason`.
oracles:
  completion: one create_completion payload; input and output tokens equal the stub (cache_read and reasoning too where set); model and provider match the stub
  embedding: one create_completion payload with operation_type EMBED; input tokens equal the stub; output tokens not asserted
  embedding_without_usage: one EMBED payload; no input tokens, because the response carries no usage (Gemini-API embed, Ollama's legacy embeddings)
  image: one create_image payload; actual_image_count >= 1; no token fields

providers:
  openai:
    extra: openai
    stub: httpx.MockTransport on an explicit httpx client (SSE bodies for streamed calls)
    expected_provider: OPENAI
    model: gpt-4o-mini
    usage: {input: 11, output: 7, cache_read: 3, reasoning: 2}
  anthropic:
    extra: anthropic
    stub: httpx2.MockTransport on an explicit httpx2 client (SSE bodies for streamed calls)
    expected_provider: ANTHROPIC
    model: claude-sonnet-4-5
    usage: {input: 11, output: 7, cache_read: 3}
  google-genai:
    extra: google-genai
    stub: threaded HTTP server on 127.0.0.1 passed as HttpOptions.base_url
    expected_provider: Google
    model: gemini-2.0-flash
    usage: {input: 11, output: 7, cache_read: 3}
  ollama:
    extra: ollama
    stub: httpx.MockTransport; module-level calls swap the default client's httpx client
    expected_provider: OLLAMA
    model: llama3
    usage: {input: 11, output: 7}
  litellm:
    extra: litellm
    stub: litellm mock_response
    expected_provider: LITELLM
    model: gpt-4o-mini
    usage: approximate
    usage_reason: mock_response computes its own token counts from the prompt and the mocked text
  perplexity:
    extra: perplexity-native, perplexity-openai
    stub: httpx.MockTransport on an explicit httpx client
    expected_provider: PERPLEXITY
    model: sonar
    usage: {input: 11, output: 7}
  fal:
    extra: fal
    stub: httpx.MockTransport injected as the fal client's cached _client (run and queue hosts)
    expected_provider: fal_ai
    model: fal_ai/fal-ai/flux/schnell
  vertex:
    extra: google-vertex
    stub: fake gapic prediction clients cached on the model (GenerativeModel._prediction_client_value and _prediction_async_client_value, the embedding endpoint's), returning real aiplatform protos
    expected_provider: Google
    model: gemini-2.0-flash
    usage: {input: 11, output: 7}
  bedrock:
    extra: anthropic (boto3)
    stub: not built; see row 14

