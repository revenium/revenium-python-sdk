# Public resource-tree inventory for the provider SDKs that have one (BACK-3612, BACK-3593 AC7).
#
# Every public method reachable from the openai, anthropic, perplexity and
# google-genai client objects (see resource_tree.py) must be either `registered`
# (mapped to the manifest.yaml rows that execute it) or `allowed` under a group
# whose `reason` says why it is not executed. test_resource_inventory.py fails on
# any live method that is neither, so a provider release that adds a surface
# fails the build until someone decides which it is.
#
# The lists are the union over the provider versions we support (the pins in the
# negative control and the latest releases), so an entry may be absent from the
# installed version; only methods missing from this file fail.
#
# Allowed reasons are judgements made on 2026-10-05. Group A is the list of
# known billable gaps: moving a method out of A means adding its wrap and its
# manifest rows.

version: 1
providers:
  openai:
    registered:
      AsyncOpenAI.chat.completions.create: [openai.chat.create.async, openai.chat.create.async.stream, perplexity.openai_compatible.chat.create.async, perplexity.openai_compatible.chat.create.async.stream, perplexity.openai_compatible.chat.create.async.perplexity_only]
      AsyncOpenAI.chat.completions.parse: [openai.chat.parse.async]
      AsyncOpenAI.chat.completions.stream: [openai.chat.stream_helper.async]
      AsyncOpenAI.embeddings.create: [openai.embeddings.create.async]
      AsyncOpenAI.responses.create: [openai.responses.create.async, openai.responses.create.async.stream]
      AsyncOpenAI.responses.parse: [openai.responses.parse.async]
      AsyncOpenAI.responses.stream: [openai.responses.stream_helper.async]
      OpenAI.chat.completions.create: [openai.chat.create.sync, openai.chat.create.sync.stream, perplexity.openai_compatible.chat.create.sync, perplexity.openai_compatible.chat.create.sync.stream, perplexity.openai_compatible.chat.create.sync.perplexity_only]
      OpenAI.chat.completions.parse: [openai.chat.parse.sync]
      OpenAI.chat.completions.stream: [openai.chat.stream_helper.sync]
      OpenAI.embeddings.create: [openai.embeddings.create.sync]
      OpenAI.responses.create: [openai.responses.create.sync, openai.responses.create.sync.stream]
      OpenAI.responses.parse: [openai.responses.parse.sync]
      OpenAI.responses.stream: [openai.responses.stream_helper.sync]
    allowed:
      - reason: "billable model usage the SDK does not meter: no wrap is registered. BACK-3593 listed images, audio, videos, realtime and the Gemini image and video calls as out of scope; the rest were first found by this inventory on 2026-10-05. Each enters the manifest with the ticket that adds its wrap"
