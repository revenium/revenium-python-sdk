# Public call-surface inventory for every SDK and framework the middleware wraps
# (BACK-3612, BACK-3593 AC7, BACK-4027).
#
# Every public method reachable from the roots in resource_tree.py (the openai,
# anthropic, perplexity, google-genai, ollama and fal clients; boto3's Bedrock
# Runtime client; the ollama, fal_client and litellm modules; the Vertex AI model,
# session, batch prediction, supervised tuning and context-cache classes; the
# LangChain callback base; the griptape drivers the SDK subclasses) must be
# either `registered` (mapped to the manifest.yaml rows that execute it) or
# `allowed` under a group whose `reason` says why it is not executed.
# test_resource_inventory.py fails on any live method that is neither, so a
# provider release that adds a surface fails the build until someone decides
# which it is.
#
# Raw and streaming-response forms (`.with_raw_response.`, `.with_streaming_response.`)
# are walked too. One whose base method is `allowed` inherits that group, since
# it reaches the same endpoint; one whose base is `registered` must be listed
# itself, because it runs through the wrap on its own code path.
#
# The lists are the union over the provider versions we support (the pins in the
# negative control and the latest releases; Vertex AI over google-cloud-aiplatform
# 1.71.1 and 2.x), so an entry may be absent from the installed version; only
# methods missing from this file fail. The frameworks (langchain, griptape) have
# no `registered` methods: the SDK meters them through the provider calls they
# make, so their groups say which hooks and driver calls reach a wrap.
#
# Allowed reasons are judgements made on 2026-10-05 and, for the roots added by
# BACK-4027, on 2026-10-08, and by BACK-4229, on 2026-10-10. New methods added to
# existing roots by BACK-4571 were judged on 2026-10-14. Group A is the list of
# known billable gaps: moving a method out of A means adding its wrap and its
# manifest rows.
#
# A group marked `disclose: true` is one the customer pays the provider for while
# nothing reaches Revenium. README.md's "Calls the SDK does not meter" list must
# name exactly those methods; tests/test_docs/test_readme_unmetered_calls.py checks it.

version: 1
providers:
