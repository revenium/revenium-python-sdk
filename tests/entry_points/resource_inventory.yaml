      AsyncOpenAI.chat.completions.create: [openai.chat.create.async, openai.chat.create.async.stream, perplexity.openai_compatible.chat.create.async, perplexity.openai_compatible.chat.create.async.stream, perplexity.openai_compatible.chat.create.async.perplexity_only]
      AsyncOpenAI.chat.completions.parse: [openai.chat.parse.async, perplexity.openai_compatible.chat.parse.async, perplexity.openai_compatible.chat.parse.async.perplexity_only, perplexity.openai_compatible.chat.parse.async.openai_only]
      AsyncOpenAI.chat.completions.stream: [openai.chat.stream_helper.async]
      AsyncOpenAI.chat.completions.with_raw_response.create: [openai.chat.raw.async.stream, perplexity.openai_compatible.chat.raw.async, perplexity.openai_compatible.chat.raw.async.stream]
      AsyncOpenAI.chat.completions.with_streaming_response.create: [openai.chat.streaming_response.async.stream, perplexity.openai_compatible.chat.streaming_response.async, perplexity.openai_compatible.chat.streaming_response.async.stream]
